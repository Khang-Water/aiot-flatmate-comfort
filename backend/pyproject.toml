[project]
name = "flatmate-api"
version = "0.6.0"
description = "FlatMate Comfort simulation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "openai==2.46.0",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper==1.2.1",
    "soundfile==0.14.0",
    "supertonic==1.3.1",
    "vieneu==3.2.3",
    "vietnormalizer==0.2.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
    "jsonschema>=4.25,<5",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
