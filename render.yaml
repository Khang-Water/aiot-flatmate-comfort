services:
  - type: web
    name: flatmate-comfort
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: WEB_ORIGIN
        value: https://flatmate-comfort.onrender.com
      - key: DATABASE_PATH
        value: /tmp/flatmate.db
      - key: LOCAL_SPEECH_ENABLED
        value: "false"
