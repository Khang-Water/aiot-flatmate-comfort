services:
  - type: web
    name: flatmate-comfort
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_MODE
        value: chat_completions
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: WEB_ORIGIN
        value: https://flatmate-comfort.onrender.com
      - key: DATABASE_PATH
        value: /tmp/flatmate.db
      - key: TTS_ENABLED
        value: "true"
      - key: LOCAL_ASR_ENABLED
        value: "false"
      - key: TTS_ENGINE
        value: piper
      - key: TTS_MAX_CHARACTERS
        value: "800"
      - key: PIPER_MODEL_PATH
        value: /app/models/vi_VN-vais1000-medium.onnx
      - key: PIPER_VOICE
        value: vi_VN-vais1000-medium
